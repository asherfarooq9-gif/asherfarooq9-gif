<svg xmlns="http://www.w3.org/2000/svg" width="270" height="200" viewBox="0 0 270 200"><style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.s{font-family:Georgia,'Times New Roman',serif}@keyframes sw{0%{opacity:0;transform:translateY(60px) rotate(-6deg)}70%{transform:translateY(-6px) rotate(1deg)}100%{opacity:1;transform:none}}.t{transform-box:fill-box;transform-origin:bottom left;opacity:0;animation:sw .9s ease forwards}@keyframes nd{50%{transform:translateX(6px)}}.ar{animation:nd 1.6s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="t" style="animation-delay:1.2s"><rect width="270" height="200" rx="14" fill="#2563eb"/><text x="24" y="38" font-size="13" letter-spacing="3" fill="#fff" opacity=".8">BUILD</text><text x="24" y="100" class="s" font-size="40" fill="#fff">Apps</text><text x="24" y="132" font-size="14" fill="#fff">Windows Notch, SmartRide, PakLex</text><text x="24" y="172" font-size="16" font-weight="700" fill="#fff">317 contributions</text><text class="ar" x="226" y="172" font-size="22" fill="#fff">→</text></g></svg>